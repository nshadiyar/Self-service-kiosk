services:
  db:
    image: postgres:16-alpine
    container_name: self-service-kiosk-db
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bromart_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bromart_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: self-service-kiosk-minio
    profiles: ["local-minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    build: .
    container_name: self-service-kiosk-app
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_PRIVATE_ENDPOINT: ${MINIO_PRIVATE_ENDPOINT}
      MINIO_PRIVATE_HOST: ${MINIO_PRIVATE_HOST}
      MINIO_PRIVATE_PORT: ${MINIO_PRIVATE_PORT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-inmate-photos}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
  minio_data:
